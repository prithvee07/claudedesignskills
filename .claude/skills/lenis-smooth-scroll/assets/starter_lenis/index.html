<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lenis Starter</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="progress-bar"></div>

    <section class="hero">
      <h1 data-speed="-0.2">Smooth Scroll</h1>
      <p>Scroll down</p>
    </section>

    <section class="panel">
      <h2 class="reveal">Parallax layers</h2>
      <div class="layer" data-speed="0.15"></div>
      <div class="layer" data-speed="-0.25"></div>
    </section>

    <section class="panel alt">
      <h2 class="reveal">Reveal on scroll</h2>
      <p class="reveal">Content fades in as it enters the viewport.</p>
    </section>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
